name: Pull request title

# Its own workflow so that editing a pull request's title or description
# reruns only this, not the full CI matrix. It runs on every edit, even one
# that left the title alone: a skipped required check counts as passed, so
# skipping would let a description edit clear a failed title.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

# Its own group: an edit here never cancels the CI matrix's run. A newer run
# cancelling an older one is safe, since both check the title as it is now.
concurrency:
  group: pr-title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    # The ruleset requires a check with exactly this name.
    name: pull request title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reads the title from the event payload, never from the command line,
      # so a title can't run code.
      - name: Pull request title (the pinned, published temple-bar)
        run: pnpm exec temple-bar pr-title
